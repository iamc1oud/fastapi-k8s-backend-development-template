services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: backend
      DB_USER: backend
      DB_PASSWORD: backend
    volumes:
      - ./src:/app/src
      - ./piccolo_conf.py:/app/piccolo_conf.py
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "piccolo migrations forwards all &&
             uvicorn src.backend.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres-data:
